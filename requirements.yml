---
functional:
  - Пользователь может зарегистрироваться и войти в систему
  - Пользователь может создать новую игру против бота
  - Пользователь может выбрать уровень сложности
  - Пользователь может отправить решение задачи и увидеть результат
  - Пользователь может просматривать историю игр и рейтинг

non-functional:
  - Сайт должен быть оптимизирован для скорости работы
  - Сайт должен быть безопасным и защищать данные пользователя
  - Сайт должен быть протестирован на совместимость с последними версиями браузеров
  - Сайт должен выдерживать нагрузку (например, 1000 одновременных пользователей)

implicit:
  - При неверном логине или пароле должно появляться сообщение об ошибке
  - После отправки решения должен приходить результат проверки
  - Игра не должна зависать при большой нагрузке
  - При потере соединения должно отображаться понятное сообщение
