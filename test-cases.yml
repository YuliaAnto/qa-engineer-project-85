---
- summary: 
    Регистрация и авторизация в системе
  requirement: 
    Пользователь может зарегистрироваться и авторизоваться в системе
  prerequisites: 
    Открыта главная страница сайта
  test-data: |
    Логин = ilona Пароль = password
  steps: 
    - Нажать кнопку «Регистрация»
    - Ввести валидный email и пароль
    - Нажать кнопку «Зарегистрироваться»
    - Выйти из аккаунта
    - Ввести валидные email и пароль
    - Нажать кнопку «Войти»
  expected_result: 
    Пользователь успешно зарегистрирован и авторизован в системе
    
- summary: 
    Выход из аккаунта
  requirement: 
    Пользователь может выйти из своего аккаунта
  prerequisites: 
    Пользователь авторизован в системе
  test-data: |
    Empty
  steps: 
    - Нажать на иконку профиля
    - Нажать кнопку «Выйти»
  expected_result: 
    Пользователь выходит из аккаунта и перенаправляется на главную страницу

- summary: 
    Отображение данных в личном кабинете
  requirement: 
    В личном кабинете отображается история игр и текущий рейтинг
  prerequisites: 
    Пользователь авторизован и имеет завершенные игры
  test-data: |
    Empty
  steps: 
    - Перейти в личный кабинет
    - Проверить наличие списка завершенных игр
    - Проверить отображение рейтинга (победы и поражения)
  expected_result: 
    В личном кабинете отображается история игр и текущий рейтинг

- summary: 
    Создание игры неавторизованным пользователем
  requirement: 
    Неавторизованный пользователь не может создавать игры
  prerequisites: 
    Пользователь не авторизован в системе
  test-data: |
    Empty
  steps: 
    - Нажать на кнопку «Создать игру»
  expected_result: 
    Создание игры недоступно, появляется предложение войти в систему

- summary: 
    Создание новой игры
  requirement: 
    Пользователь может создать новую игру по нажатию кнопки «Create game»
  prerequisites: 
    Пользователь авторизован в системе
  test-data: |
    Empty
  steps: 
    - Нажать кнопку «Create game»
  expected_result: 
    Игра успешно создана, пользователь перенесен в режим ожидания соперника

- summary: 
    Выбор языка программирования в процессе игры
  requirement: 
    Язык программирования выбирается уже в процессе игры
  prerequisites: 
    Игра создана
  test-data: |
    Empty
  steps: 
    - Дождаться загрузки игрового пространства
    - Выбрать язык программирования из списка доступных
  expected_result: 
    Язык программирования успешно выбран, интерфейс редактора кода обновился

- summary: 
    Отображение игры в списке доступных
  requirement: 
    Игра отображается в списке «доступных для подключения»
  prerequisites: 
    Первый игрок создал игру и ожидает соперника
  test-data: |
    Empty
  steps: 
    - Открыть список доступных игр со стороны второго игрока
    - Найти созданную игру
  expected_result: 
    Игра отображается в списке «доступных для подключения»

- summary: 
    Подключение второго игрока к игре
  requirement: 
    Второй игрок может подключиться к игре по нажатию кнопки «Connect to game»
  prerequisites: 
    Игра отображается в списке доступных
  test-data: |
    Empty
  steps: 
    - Второй игрок нажимает кнопку «Connect to game»
  expected_result: 
    Оба игрока переносятся в игровое пространство, начинается игра
 
- summary: 
    Синхронизация кода в реальном времени
  requirement: 
    В игре реализована синхронизация кода в реальном времени
  prerequisites: 
    Игра началась, оба игрока в игровом пространстве
  test-data: |
    Empty
  steps: 
    - Первый игрок начинает вводить код в своем редакторе
  expected_result: 
    Код, вводимый первым игроком, отображается у второго игрока в реальном времени

- summary: 
    Отправка решения и получение результата
  requirement: 
    Пользователь может отправить решение задачи и увидеть результат
  prerequisites: 
    Игра началась, отображается условие задачи
  test-data: |
    Empty
  steps: 
    - Написать код решения в редакторе
    - Нажать кнопку «Check»
  expected_result: 
    Приходит результат проверки (успешно или ошибка)

- summary: 
    Отображение окна победителя при успешном решении
  requirement: 
    При успешном решении задачи отображается окно «Победитель»
  prerequisites: 
    Код решения написан верно
  test-data: |
    Empty
  steps: 
    - Нажать кнопку «Check»
  expected_result: 
    Открывается модальное окно «Победитель»

- summary: 
    Поведение проигравшего игрока после победы соперника
  requirement: 
    Проигравший может продолжить работу над кодом или выйти из игры
  prerequisites: 
    Соперник успешно решил задачу, открыто окно «Победитель»
  test-data: |
    Empty
  steps: 
    - Проигравший игрок закрывает окно «Победитель»
    - Пробует продолжить вводить код и нажать «Check»
    - Нажимает кнопку «Выйти»
  expected_result: 
    Проигравший может продолжать работу над кодом, проверять его или выйти из игры

- summary: 
    Просмотр истории завершенных игр
  requirement: 
    Пользователь может просматривать историю завершенных игр
  prerequisites: 
    Пользователь авторизован, есть завершенные игры
  test-data: |
    Empty
  steps: 
    - Перейти в личный кабинет
    - Найти раздел с историей игр
    - Открыть любую завершенную игру
  expected_result: 
    Пользователь может просмотреть детали завершенной игры

- summary: 
    Отображение таймера и доступность кнопки Check
  requirement: 
    В игре отображается таймер и кнопка «Check» доступна неограниченное количество раз
  prerequisites: 
    Игра началась
  test-data: |
    Empty
  steps: 
    - Проверить отображение таймера в интерфейсе
    - Нажать кнопку «Check» несколько раз подряд с некорректным кодом
  expected_result: 
    Таймер отображается и идет, кнопка «Check» не блокируется и доступна для нажатия многократно

- summary: 
    Запуск тестов на локальном коде
  requirement: 
    Тесты запускаются только на локальном коде пользователя
  prerequisites: 
    Игра началась, у пользователя есть код в редакторе
  test-data: |
    Empty
  steps: 
    - Написать код в редакторе
    - Нажать кнопку «Check»
  expected_result: 
    Тесты запускаются только для текущего пользователя и не зависят от кода соперника

- summary: 
    Проверка скорости работы сайта
  requirement: 
    Сайт должен быть оптимизирован для скорости работы
  prerequisites: 
    Открыта главная страница
  test-data: |
    Empty
  steps: 
    - Замерить время загрузки страницы
  expected_result: 
    Страница загружается за приемлемое время (без долгих зависаний)

- summary: 
    Безопасность и защита данных пользователя
  requirement: 
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: 
    Открыта страница регистрации
  test-data: |
    Логин = ilona Пароль = password
  steps: 
    - Ввести пароль
    - Проверить, отображается ли он в открытом виде
  expected_result: 
    Пароль скрыт (отображается звездочками), данные передаются по защищенному соединению

- summary: 
    Совместимость с последними версиями браузеров
  requirement: 
    Сайт должен быть протестирован на совместимость с последними версиями браузеров
  prerequisites: 
    Используются последние версии браузеров (Chrome, Firefox, Safari, Edge)
  test-data: |
    Empty
  steps: 
    - Открыть сайт в каждом из указанных браузеров
    - Выполнить базовые действия (авторизация, создание игры)
  expected_result: 
    Сайт корректно отображается и работает во всех перечисленных браузерах

- summary: 
    Проверка нагрузки в 1000 одновременных пользователей
  requirement: 
    Сайт должен выдерживать нагрузку (например, 1000 одновременных пользователей)
  prerequisites: 
    Используются инструменты нагрузочного тестирования
  test-data: |
    Empty
  steps: 
    - Создать виртуальную нагрузку в 1000 одновременных пользователей
    - Наблюдать за работой системы
  expected_result: 
    Сайт продолжает работать без ошибок и критических зависаний

- summary: 
    Синхронизация кода в реальном времени
  requirement: 
    Система должна поддерживать синхронизацию кода в реальном времени
  prerequisites: 
    Игра началась
  test-data: |
    Empty
  steps: 
    - Проверить сетевое соединение в инструментах разработчика (DevTools)
  expected_result: 
    Используется протокол WebSocket или аналог для мгновенной передачи данных

- summary: 
    Восстановление сессии при разрыве соединения
  requirement: 
    Система должна поддерживать восстановление сессии при разрыве соединения
  prerequisites: 
    Игра началась, есть соединение
  test-data: |
    Empty
  steps: 
    - Разорвать интернет-соединение
    - Восстановить интернет-соединение
    - Попробовать вернуться в игру
  expected_result: 
    Система восстанавливает сессию по ID, данные игры не потеряны

- summary: 
    Сообщение при неверном логине или пароле
  requirement: 
    При неверном логине или пароле должно появляться сообщение об ошибке
  prerequisites: 
    Открыта форма авторизации
  test-data: |
    Empty
  steps: 
    - Ввести неверный логин или пароль
    - Нажать кнопку «Войти»
  expected_result: 
    Появляется понятное сообщение об ошибке, вход не осуществляется
  
- summary: 
    Получение результата после отправки решения
  requirement: 
    После отправки решения должен приходить результат проверки
  prerequisites: 
    Игра началась
  test-data: |
    Empty
  steps: 
    - Отправить решение задачи
  expected_result: 
    Сразу после отправки приходит результат (успех или ошибка)

- summary: 
    Отсутствие зависаний при большой нагрузке
  requirement: 
    Игра не должна зависать при большой нагрузке
  prerequisites: 
    Создана высокая нагрузка на систему
  test-data: |
    Empty
  steps: 
    - Начать игру в условиях высокой нагрузки
    - Отправить решение
  expected_result:
    Игра работает без зависаний, решение обрабатывается корректно

- summary: 
    Сообщение при потере соединения
  requirement: 
    При потере соединения должно отображаться понятное сообщение
  prerequisites: 
    Игра началась
  test-data: |
    Empty
  steps: 
    - Разорвать интернет-соединение
  expected_result: 
    Отображается понятное сообщение о потере соединения

- summary: 
    Блокировка кнопки Check у победителя
  requirement: 
    У победителя после победы кнопка «Check» блокируется
  prerequisites: 
    Пользователь успешно решил задачу, открыто окно «Победитель»
  test-data: |
    Empty
  steps: 
    - Закрыть окно «Победитель»
    - Попробовать нажать кнопку «Check»
  expected_result: 
    Кнопка «Check» неактивна и не нажимается

- summary: 
    Удаление игры после выхода обоих игроков
  requirement: 
    Игра удаляется из системы только после выхода обоих игроков
  prerequisites: 
    Игра началась, два игрока подключены
  test-data: |
    Empty
  steps: 
    - Первый игрок выходит из игры
    - Проверить, что игра все еще существует
    - Второй игрок выходит из игры
  expected_result: 
    Игра удаляется из списка активных только после выхода второго игрока
 
