- summary: 
    Создание игры против бота
  requirement:
    Пользователь может создать новую игру против бота
  prerequisites:
    Пользователь авторизован в системе, открыта главная страница
  steps: 
    1. Нажать кнопку «Создать игру»
    2. Выбрать опцию «Игра против бота»
    3. Выбрать уровень сложности (например, «Средний»)
    4. Нажать кнопку «Начать игру»
  expected_result:
    Игра создана, отображается условие задачи, запущен таймер

- summary: 
    Отправка решения задачи
  requirement:
    Пользователь может отправить решение задачи и увидеть результат
  prerequisites:
    Игра против бота начата, отображается условие задачи
  steps: 
    1. Написать решение задачи на выбранном языке программирования
    2. Нажать кнопку «Отправить решение»
  expected_result: 
    Решение отправлено, отображается результат проверки (успешно/неуспешно)
